<!DOCTYPE html>
<html lang="pt-BR">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InstaContent Pro - Gerador de Artes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- INTEGRAÇÃO COM O SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>

<style>
  :root { --ink: #0f1e1a; --emerald: #1e6b52; --emerald-deep: #0f4a38; --emerald-light: #d4e9e0; --champagne: #c9a961; --champagne-light: #f1e6cd; --cream: #faf7f0; --cream-2: #f3eee2; --line: #e6e0d1; --white: #ffffff; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
  body { background: var(--cream); color: var(--ink); min-height: 100vh; }
  
  .header { background: rgba(250,247,240,0.9); backdrop-filter: blur(24px); padding: 18px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 100; }
  .logo-mark { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--emerald), var(--emerald-deep)); display: flex; align-items: center; justify-content: center; color: var(--champagne); font-family: 'Fraunces', serif; font-size: 22px; font-weight: 800; box-shadow: 0 6px 20px rgba(30,107,82,0.3); position: relative; }
  .logo-mark::after { content: ''; position: absolute; inset: 2px; border: 1px solid rgba(201,169,97,0.4); border-radius: 10px; }
  .logo { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 700; line-height: 1.1; }
  .logo span { font-family: 'Inter', sans-serif; font-size: 11px; color: var(--ink-soft); font-weight: 500; display: block; letter-spacing: 0.5px; text-transform: uppercase; opacity: 0.7; margin-top: 2px; }
  
  .container { max-width: 1440px; margin: 0 auto; padding: 40px 32px; display: grid; grid-template-columns: 420px 1fr; gap: 32px; align-items: start; }
  .panel { background: var(--white); border-radius: 24px; padding: 32px; box-shadow: 0 8px 30px rgba(15,30,26,0.10); border: 1px solid var(--line); }
  .panel-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .panel-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--champagne); }
  .section-label { font-size: 11px; font-weight: 700; color: var(--ink-soft); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; opacity: 0.7; }
  
  .format-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 24px; }
  .format-btn { padding: 12px 8px; border: 1.5px solid var(--line); background: var(--cream); border-radius: 12px; cursor: pointer; font-size: 11px; font-weight: 600; text-align: center; color: var(--ink-soft); transition: all 0.2s; }
  .format-btn.active { background: var(--ink); color: var(--champagne-light); border-color: var(--ink); }
  
  .template-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 24px; }
  .template-btn { aspect-ratio: 1; border: 2px solid var(--line); border-radius: 10px; cursor: pointer; transition: all 0.2s; display: flex; align-items: flex-end; justify-content: center; font-size: 9px; font-weight: 700; color: white; text-align: center; padding: 6px 4px; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
  .template-btn.active { border-color: var(--emerald); border-width: 3px; box-shadow: 0 0 0 4px rgba(30,107,82,0.15); }
  
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 8px; }
  .form-group input, .form-group textarea { width: 100%; padding: 13px 16px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 14px; background: var(--cream); color: var(--ink); }
  .form-group textarea { resize: vertical; min-height: 72px; }
  
  .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-primary { background: linear-gradient(135deg, var(--ink), #1a2f28); color: var(--champagne-light); }
  .btn-success { background: linear-gradient(135deg, var(--champagne), #a88945); color: var(--ink); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .preview-area { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 600px; }
  .canvas-wrapper { box-shadow: 0 20px 60px rgba(15,30,26,0.15); border-radius: 20px; overflow: hidden; max-width: 100%; }
  #canvas { display: block; background: white; max-width: 100%; height: auto; }
  
  .empty-state { text-align: center; color: var(--ink-soft); padding: 60px 40px; }
  .empty-icon { font-size: 60px; margin-bottom: 20px; }
  .empty-state h3 { font-family: 'Fraunces', serif; font-size: 24px; margin-bottom: 10px; }

  @media (max-width: 968px) { .container { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="header">
  <div class="logo-wrap" style="display:flex; align-items:center; gap:12px;">
    <div class="logo-mark">I</div>
    <div class="logo">InstaContent Pro<span>Gerador de Artes</span></div>
  </div>
  <a href="dashboard.html" style="text-decoration:none; color:var(--emerald); font-weight:600; font-size:14px;">📊 Meu Dashboard</a>
</header>

<div class="container">
  <div class="panel">
    <h2 class="panel-title"><span class="dot"></span> Criar Nova Arte</h2>
    
    <div class="section-label">Formato</div>
    <div class="format-grid" id="formatGrid">
      <button class="format-btn active" data-format="post">📷 Post</button>
      <button class="format-btn" data-format="story">📱 Story</button>
      <button class="format-btn" data-format="carousel">🎠 Carrossel</button>
    </div>
    
    <div class="section-label">Template</div>
    <div class="template-grid" id="templateGrid"></div>
    
    <div class="section-label" style="margin-top:20px;">Conteúdo</div>
    <div class="form-group">
      <label>Texto Principal</label>
      <input type="text" id="mainText" value="Agenda de Sábado Aberta">
    </div>
    <div class="form-group">
      <label>Subtítulo</label>
      <textarea id="subText">Garanta seu horário pelo WhatsApp antes que esgote. Vagas limitadas!</textarea>
    </div>
    <div class="form-group">
      <label>Sua Marca (@)</label>
      <input type="text" id="brandText" value="@seu.salao">
    </div>
    <div class="form-group">
      <label>Emoji</label>
      <input type="text" id="emojiText" value="✨">
    </div>
    
    <button class="btn btn-primary" onclick="generate()">✨ Gerar Material</button>
    <button class="btn btn-success" onclick="downloadPNG()" id="downloadBtn" disabled>⬇️ Baixar Imagem</button>
  </div>
  
  <div class="panel preview-area">
    <div id="emptyState" class="empty-state">
      <div class="empty-icon">🎨</div>
      <h3>Sua arte aparece aqui</h3>
      <p>Preencha os campos ao lado e clique em "Gerar Material".</p>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper" style="display:none;">
      <canvas id="canvas" width="1080" height="1080"></canvas>
    </div>
  </div>
</div>

<script>
const TEMPLATES = [
  { key: 'antesdepois', nome: 'Antes & Depois', bg: ['#faf7f0','#e8dcc4'], text: '#0f1e1a', accent: '#c9a961' },
  { key: 'promo', nome: 'Promo do Dia', bg: ['#1e6b52','#0f4a38'], text: '#faf7f0', accent: '#c9a961' },
  { key: 'depoimento', nome: 'Depoimento', bg: ['#faf7f0','#f3eee2'], text: '#0f1e1a', accent: '#c9a961' },
  { key: 'agenda', nome: 'Agenda Aberta', bg: ['#d4e9e0','#f1e6cd'], text: '#0f1e1a', accent: '#1e6b52' },
  { key: 'bastidores', nome: 'Bastidores', bg: ['#0f1e1a','#1a2f28'], text: '#faf7f0', accent: '#c9a961' },
  { key: 'preco', nome: 'Tabela de Preço', bg: ['#c9a961','#a88945'], text: '#0f1e1a', accent: '#faf7f0' }
];
const FORMATS = { post: { w: 1080, h: 1080 }, story: { w: 1080, h: 1920 }, carousel: { w: 1080, h: 1350 } };
const CTA_FIXO = "CHAME NO DIRECT PARA AGENDAR";

let state = { templateIndex: 0, format: 'post' };

function init() {
  renderTemplateButtons();
  document.querySelectorAll('.format-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.format = btn.dataset.format;
      if (document.getElementById('canvasWrapper').style.display !== 'none') generate();
    };
  });
  ['mainText', 'subText', 'brandText', 'emojiText'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      if (document.getElementById('canvasWrapper').style.display !== 'none') generate();
    });
  });
}

function renderTemplateButtons() {
  const grid = document.getElementById('templateGrid');
  grid.innerHTML = '';
  TEMPLATES.forEach((tpl, i) => {
    const btn = document.createElement('div');
    btn.className = 'template-btn' + (i === state.templateIndex ? ' active' : '');
    btn.style.background = `linear-gradient(135deg, ${tpl.bg[0]}, ${tpl.bg[1]})`;
    btn.style.color = tpl.text;
    btn.textContent = tpl.nome;
    btn.onclick = () => { state.templateIndex = i; renderTemplateButtons(); if (document.getElementById('canvasWrapper').style.display !== 'none') generate(); };
    grid.appendChild(btn);
  });
}

function generate() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const fmt = FORMATS[state.format];
  canvas.width = fmt.w; canvas.height = fmt.h;
  const tpl = TEMPLATES[state.templateIndex];
  const W = fmt.w, H = fmt.h;

  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, tpl.bg[0]); grad.addColorStop(1, tpl.bg[1]);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  
  ctx.globalAlpha = 0.08; ctx.fillStyle = tpl.accent;
  ctx.beginPath(); ctx.arc(W * 0.95, H * 0.05, W * 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(W * 0.05, H * 0.95, W * 0.35, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  
  ctx.fillStyle = tpl.accent; ctx.fillRect(W * 0.08, H * 0.1, 120, 10);

  const emoji = document.getElementById('emojiText').value;
  if (emoji) {
    ctx.font = `${W * 0.16}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(emoji, W / 2, H * 0.28);
  }

  const mainText = document.getElementById('mainText').value || 'Seu Texto';
  const subText = document.getElementById('subText').value;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let mainY = emoji ? H * 0.5 : H * 0.4;

  const fontSize = mainText.length > 40 ? W * 0.065 : (mainText.length > 25 ? W * 0.08 : W * 0.095);
  ctx.font = `800 ${fontSize}px Arial, sans-serif`; ctx.fillStyle = tpl.text;
  const mainLines = wrapText(ctx, mainText, W * 0.85);
  const lineH = fontSize * 1.15;
  const mainStartY = mainY - ((mainLines.length - 1) * lineH) / 2;
  mainLines.forEach((line, i) => ctx.fillText(line, W / 2, mainStartY + i * lineH));

  if (subText) {
    ctx.font = `400 ${W * 0.032}px Arial, sans-serif`; ctx.fillStyle = tpl.text; ctx.globalAlpha = 0.85;
    const subLines = wrapText(ctx, subText, W * 0.78);
    const subStartY = mainStartY + (mainLines.length - 1) * lineH + fontSize * 1.2;
    subLines.slice(0, 4).forEach((line, i) => ctx.fillText(line, W / 2, subStartY + i * (W * 0.048)));
    ctx.globalAlpha = 1;
  }

  ctx.font = `700 ${W * 0.028}px Arial, sans-serif`; ctx.fillStyle = tpl.accent; ctx.globalAlpha = 0.95;
  ctx.fillText(CTA_FIXO, W / 2, H * 0.87); ctx.globalAlpha = 1;

  const brand = document.getElementById('brandText').value;
  if (brand) {
    ctx.font = `600 ${W * 0.03}px Arial, sans-serif`; ctx.fillStyle = tpl.text; ctx.textAlign = 'left'; ctx.globalAlpha = 0.9;
    ctx.fillText(brand, W * 0.08, H * 0.94); ctx.globalAlpha = 1;
  }

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('canvasWrapper').style.display = 'block';
  document.getElementById('downloadBtn').disabled = false;

  // SALVA A ARTE NO SUPABASE (Se o usuário estiver logado)
  const arteData = {
    titulo: document.getElementById('mainText').value || 'Arte sem título',
    nicho: 'beleza',
    formato: state.format,
    template: state.templateIndex,
    mainText: document.getElementById('mainText').value,
    subText: document.getElementById('subText').value,
    brandText: document.getElementById('brandText').value,
    emoji: document.getElementById('emojiText').value
  };
  salvarArteSupabase(arteData, canvas);
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' '); const lines = []; let current = '';
  words.forEach(word => {
    const test = current ? current + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && current) { lines.push(current); current = word; }
    else current = test;
  });
  if (current) lines.push(current);
  return lines;
}

function downloadPNG() {
  const canvas = document.getElementById('canvas');
  const link = document.createElement('a');
  link.download = `instacontent-${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

init();
</script>
</body>
</html>
