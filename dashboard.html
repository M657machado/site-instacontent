<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Dashboard — InstaContent Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --ink: #0f1e1a; --emerald: #1e6b52; --champagne: #c9a961; --champagne-light: #f1e6cd; --cream: #faf7f0; --white: #ffffff; --line: #e6e0d1; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; }
  
  .header { background: var(--white); padding: 18px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
  .logo { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 700; color: var(--emerald); }
  
  .login-box { background: var(--white); padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 400px; margin: 100px auto; border: 1px solid var(--line); }
  .btn-google { display: inline-flex; align-items: center; gap: 10px; background: var(--emerald); color: white; padding: 14px 24px; border-radius: 10px; font-weight: 700; border: none; cursor: pointer; margin-top: 20px; width: 100%; justify-content: center; }
  
  .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; display: none; }
  .user-bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-bottom: 30px; }
  .user-bar img { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--champagne); }
  .btn-logout { background: transparent; border: 1px solid var(--line); padding: 6px 14px; border-radius: 100px; cursor: pointer; font-size: 12px; }
  
  .page-title { font-family: 'Fraunces', serif; font-size: 36px; margin-bottom: 30px; }
  
  .artes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px; }
  .arte-card { background: var(--white); border-radius: 16px; border: 1px solid var(--line); overflow: hidden; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.2s; }
  .arte-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
  .arte-thumb { aspect-ratio: 1; position: relative; background: var(--cream); }
  .arte-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .arte-info { padding: 16px; }
  .arte-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .arte-meta { font-size: 12px; color: #666; }
  
  .empty-state { text-align: center; padding: 60px; background: var(--white); border-radius: 20px; border: 2px dashed var(--line); grid-column: 1 / -1; }
  .empty-state h3 { font-family: 'Fraunces', serif; font-size: 24px; margin-bottom: 10px; }
  .btn-new { display: inline-block; background: var(--emerald); color: white; padding: 12px 24px; border-radius: 10px; text-decoration: none; font-weight: 700; margin-top: 20px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">InstaContent Pro</div>
  <a href="app-beleza.html" style="text-decoration:none; color:var(--emerald); font-weight:600; font-size:14px;">+ Nova Arte</a>
</div>

<!-- Tela de Login -->
<div id="loginView">
  <div class="login-box">
    <h2 style="font-family:'Fraunces'; font-size:24px; margin-bottom:10px;">Acesse seu Dashboard</h2>
    <p style="color:#666; font-size:14px;">Faça login para ver o histórico de todas as artes que você já criou.</p>
    <button class="btn-google" onclick="loginComGoogle()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Entrar com Google
    </button>
  </div>
</div>

<!-- Tela do Dashboard -->
<div class="container" id="dashboardView">
  <div class="user-bar">
    <img id="userAvatar" src="" alt="Avatar">
    <span id="userName" style="font-weight:600; font-size:14px;"></span>
    <button class="btn-logout" onclick="logout()">Sair</button>
  </div>

  <h1 class="page-title">Minhas Artes</h1>

  <div class="artes-grid" id="artesGrid">
    <!-- As artes aparecerão aqui -->
  </div>
</div>

<script>
  // CONFIGURAÇÃO DIRETA DO SUPABASE
  const SUPABASE_URL = 'https://oquamaskbwarzybqltsa.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_h5eJ2DK1de3jEP0HWTgW2w_wl-6-nka';
  
  const { createClient } = supabase;
  const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function loginComGoogle() {
    const { data, error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/dashboard.html' }
    });
    if (error) console.error('Erro no login:', error);
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.reload();
  }

  async function usuarioAtual() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    return user;
  }

  async function listarArtes() {
    const user = await usuarioAtual();
    if (!user) return [];
    const { data, error } = await supabaseClient
      .from('artes')
      .select('*')
      .eq('user_id', user.id)
      .order('created_at', { ascending: false });
    return error ? [] : data;
  }

  async function init() {
    const currentUser = await usuarioAtual();
    
    if (!currentUser) {
      document.getElementById('loginView').style.display = 'block';
      return;
    }

    document.getElementById('loginView').style.display = 'none';
    document.getElementById('dashboardView').style.display = 'block';
    
    document.getElementById('userAvatar').src = currentUser.user_metadata?.avatar_url || 'https://ui-avatars.com/api/?name=' + currentUser.email;
    document.getElementById('userName').textContent = currentUser.user_metadata?.full_name || currentUser.email;

    const artesList = await listarArtes();
    renderArtes(artesList);
  }

  function renderArtes(artes) {
    const grid = document.getElementById('artesGrid');
    
    if (artes.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <h3>Nenhuma arte criada ainda</h3>
          <p>Suas artes geradas aparecerão aqui. Vá para o gerador e crie a primeira!</p>
          <a href="app-beleza.html" class="btn-new">Criar Primeira Arte</a>
        </div>
      `;
      return;
    }

    grid.innerHTML = artes.map(arte => `
      <div class="arte-card">
        <div class="arte-thumb">
          <img src="${arte.imagem_url}" alt="${arte.titulo}" loading="lazy">
        </div>
        <div class="arte-info">
          <div class="arte-title">${arte.titulo}</div>
          <div class="arte-meta">${new Date(arte.created_at).toLocaleDateString('pt-BR')} · ${arte.formato}</div>
        </div>
      </div>
    `).join('');
  }

  init();
</script>
</body>
</html>
