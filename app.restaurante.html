<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InstaContent Pro - Gerador Restaurantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>

<style>
  :root { --ink: #1a0f0f; --wine: #7a1f2b; --wine-deep: #4a0f18; --champagne: #c9a961; --cream: #faf7f0; --white: #ffffff; --line: #e6e0d1; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body { background: var(--cream); color: var(--ink); min-height: 100vh; }
  
  .header { background: rgba(250,247,240,0.9); backdrop-filter: blur(24px); padding: 18px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
  .logo-mark { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--wine), var(--wine-deep)); display: flex; align-items: center; justify-content: center; color: var(--champagne); font-family: 'Fraunces', serif; font-size: 22px; font-weight: 800; }
  .logo { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 700; }
  .logo span { font-size: 11px; text-transform: uppercase; opacity: 0.7; display: block; }
  
  .container { max-width: 1440px; margin: 0 auto; padding: 40px 32px; display: grid; grid-template-columns: 420px 1fr; gap: 32px; }
  .panel { background: var(--white); border-radius: 24px; padding: 32px; border: 1px solid var(--line); }
  .panel-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; margin-bottom: 20px; }
  
  .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; color: #666; }
  .format-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 24px; }
  .format-btn { padding: 12px 8px; border: 1.5px solid var(--line); background: var(--cream); border-radius: 12px; cursor: pointer; font-size: 11px; font-weight: 600; }
  .format-btn.active { background: var(--wine); color: var(--white); border-color: var(--wine); }
  
  .template-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 24px; }
  .template-btn { aspect-ratio: 1; border: 2px solid var(--line); border-radius: 10px; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; font-size: 9px; font-weight: 700; color: white; padding: 6px; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
  .template-btn.active { border-color: var(--champagne); border-width: 3px; }
  
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  .form-group input, .form-group textarea { width: 100%; padding: 13px 16px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 14px; background: var(--cream); }
  
  .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
  .btn-primary { background: var(--wine); color: var(--white); }
  .btn-success { background: var(--champagne); color: var(--ink); }
  
  .canvas-wrapper { box-shadow: 0 20px 60px rgba(0,0,0,0.15); border-radius: 20px; overflow: hidden; max-width: 100%; }
  #canvas { display: block; max-width: 100%; height: auto; }
</style>
</head>
<body>

<header class="header">
  <div class="logo-wrap" style="display:flex; align-items:center; gap:12px;">
    <div class="logo-mark">I</div>
    <div class="logo">InstaContent Pro<span>Restaurantes</span></div>
  </div>
  <a href="dashboard.html" style="text-decoration:none; color:var(--wine); font-weight:600;">📊 Dashboard</a>
</header>

<div class="container">
  <div class="panel">
    <h2 class="panel-title">Criar Nova Arte</h2>
    
    <div class="section-label">Formato</div>
    <div class="format-grid" id="formatGrid">
      <button class="format-btn active" data-format="post">📷 Post</button>
      <button class="format-btn" data-format="story">📱 Story</button>
    </div>
    
    <div class="section-label">Template</div>
    <div class="template-grid" id="templateGrid"></div>
    
    <div class="section-label">Conteúdo</div>
    <div class="form-group">
      <label>Prato / Promoção</label>
      <input type="text" id="mainText" value="Prato do Dia: Risoto">
    </div>
    <div class="form-group">
      <label>Descrição</label>
      <textarea id="subText">Servido com vinho branco. Só hoje, das 18h às 23h.</textarea>
    </div>
    <div class="form-group">
      <label>Nome do Restaurante</label>
      <input type="text" id="brandText" value="@seurestaurante">
    </div>
    <div class="form-group">
      <label>Emoji</label>
      <input type="text" id="emojiText" value="🍝">
    </div>
    
    <button class="btn btn-primary" onclick="generate()">✨ Gerar Material</button>
    <button class="btn btn-success" onclick="downloadPNG()" id="downloadBtn" disabled>⬇️ Baixar Imagem</button>
  </div>
  
  <div class="panel" style="display:flex; align-items:center; justify-content:center;">
    <div id="emptyState" style="text-align:center; color:#666;">
      <h3>Seu cardápio aparece aqui</h3>
      <p>Preencha os campos e clique em Gerar.</p>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper" style="display:none;">
      <canvas id="canvas" width="1080" height="1080"></canvas>
    </div>
  </div>
</div>

<script>
const TEMPLATES = [
  { nome: 'Prato do Dia', bg: ['#4a0f18','#7a1f2b'], text: '#ffffff', accent: '#c9a961' },
  { nome: 'Promoção', bg: ['#c9a961','#a88945'], text: '#1a0f0f', accent: '#7a1f2b' },
  { nome: 'Review', bg: ['#faf7f0','#f3eee2'], text: '#1a0f0f', accent: '#c9a961' },
  { nome: 'Delivery', bg: ['#7a1f2b','#4a0f18'], text: '#ffffff', accent: '#c9a961' },
  { nome: 'Reserva', bg: ['#1a0f0f','#2a1a1a'], text: '#ffffff', accent: '#c9a961' },
  { nome: 'Cardápio', bg: ['#faf7f0','#e8dcc4'], text: '#1a0f0f', accent: '#7a1f2b' }
];
const FORMATS = { post: { w: 1080, h: 1080 }, story: { w: 1080, h: 1920 } };
const CTA_FIXO = "PEÇA PELO WHATSAPP";

let state = { templateIndex: 0, format: 'post' };

function init() {
  renderTemplateButtons();
  document.querySelectorAll('.format-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.format = btn.dataset.format;
      if (document.getElementById('canvasWrapper').style.display !== 'none') generate();
    };
  });
  ['mainText', 'subText', 'brandText', 'emojiText'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      if (document.getElementById('canvasWrapper').style.display !== 'none') generate();
    });
  });
}

function renderTemplateButtons() {
  const grid = document.getElementById('templateGrid');
  grid.innerHTML = '';
  TEMPLATES.forEach((tpl, i) => {
    const btn = document.createElement('div');
    btn.className = 'template-btn' + (i === state.templateIndex ? ' active' : '');
    btn.style.background = `linear-gradient(135deg, ${tpl.bg[0]}, ${tpl.bg[1]})`;
    btn.style.color = tpl.text;
    btn.textContent = tpl.nome;
    btn.onclick = () => { state.templateIndex = i; renderTemplateButtons(); if (document.getElementById('canvasWrapper').style.display !== 'none') generate(); };
    grid.appendChild(btn);
  });
}

function generate() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const fmt = FORMATS[state.format];
  canvas.width = fmt.w; canvas.height = fmt.h;
  const tpl = TEMPLATES[state.templateIndex];
  const W = fmt.w, H = fmt.h;

  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, tpl.bg[0]); grad.addColorStop(1, tpl.bg[1]);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  
  ctx.globalAlpha = 0.08; ctx.fillStyle = tpl.accent;
  ctx.beginPath(); ctx.arc(W * 0.95, H * 0.05, W * 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(W * 0.05, H * 0.95, W * 0.35, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  
  ctx.fillStyle = tpl.accent; ctx.fillRect(W * 0.08, H * 0.1, 120, 10);

  const emoji = document.getElementById('emojiText').value;
  if (emoji) {
    ctx.font = `${W * 0.16}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(emoji, W / 2, H * 0.28);
  }

  const mainText = document.getElementById('mainText').value || 'Seu Texto';
  const subText = document.getElementById('subText').value;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let mainY = emoji ? H * 0.5 : H * 0.4;

  const fontSize = mainText.length > 40 ? W * 0.065 : (mainText.length > 25 ? W * 0.08 : W * 0.095);
  ctx.font = `800 ${fontSize}px Arial, sans-serif`; ctx.fillStyle = tpl.text;
  const mainLines = wrapText(ctx, mainText, W * 0.85);
  const lineH = fontSize * 1.15;
  const mainStartY = mainY - ((mainLines.length - 1) * lineH) / 2;
  mainLines.forEach((line, i) => ctx.fillText(line, W / 2, mainStartY + i * lineH));

  if (subText) {
    ctx.font = `400 ${W * 0.032}px Arial, sans-serif`; ctx.fillStyle = tpl.text; ctx.globalAlpha = 0.85;
    const subLines = wrapText(ctx, subText, W * 0.78);
    const subStartY = mainStartY + (mainLines.length - 1) * lineH + fontSize * 1.2;
    subLines.slice(0, 4).forEach((line, i) => ctx.fillText(line, W / 2, subStartY + i * (W * 0.048)));
    ctx.globalAlpha = 1;
  }

  ctx.font = `700 ${W * 0.028}px Arial, sans-serif`; ctx.fillStyle = tpl.accent; ctx.globalAlpha = 0.95;
  ctx.fillText(CTA_FIXO, W / 2, H * 0.87); ctx.globalAlpha = 1;

  const brand = document.getElementById('brandText').value;
  if (brand) {
    ctx.font = `600 ${W * 0.03}px Arial, sans-serif`; ctx.fillStyle = tpl.text; ctx.textAlign = 'left'; ctx.globalAlpha = 0.9;
    ctx.fillText(brand, W * 0.08, H * 0.94); ctx.globalAlpha = 1;
  }

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('canvasWrapper').style.display = 'block';
  document.getElementById('downloadBtn').disabled = false;

  const arteData = {
    titulo: document.getElementById('mainText').value,
    nicho: 'restaurante',
    formato: state.format,
    template: state.templateIndex,
    mainText: document.getElementById('mainText').value,
    subText: document.getElementById('subText').value,
    brandText: document.getElementById('brandText').value,
    emoji: document.getElementById('emojiText').value
  };
  salvarArteSupabase(arteData, canvas);
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' '); const lines = []; let current = '';
  words.forEach(word => {
    const test = current ? current + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && current) { lines.push(current); current = word; }
    else current = test;
  });
  if (current) lines.push(current);
  return lines;
}

function downloadPNG() {
  const canvas = document.getElementById('canvas');
  const link = document.createElement('a');
  link.download = `instacontent-restaurante-${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

init();
</script>
</body>
</html>
