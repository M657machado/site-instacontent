<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InstaContent Pro — Escolha seu nicho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0f1e1a; --emerald: #1e6b52; --champagne: #c9a961; --cream: #faf7f0; --white: #ffffff; --line: #e6e0d1; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
  
  .hero { text-align: center; max-width: 800px; margin-bottom: 60px; }
  .hero h1 { font-family: 'Fraunces', serif; font-size: 56px; color: var(--ink); margin-bottom: 16px; letter-spacing: -1px; }
  .hero p { font-size: 18px; color: #555; opacity: 0.8; }
  
  grid-template-columns: repeat(3, 1fr); 30px; max-width: 1000px; width: 100%; }
  .card { background: var(--white); border-radius: 24px; padding: 40px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); transition: all 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: flex-start; }
  .card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); border-color: var(--champagne); }
  
  .card.beleza { background: linear-gradient(135deg, #fff, #fdf0f0); }
  .card.imob { background: linear-gradient(135deg, #fff, #f0f4fa); }
  
  .icon { font-size: 48px; margin-bottom: 20px; }
  .card h2 { font-family: 'Fraunces', serif; font-size: 32px; margin-bottom: 12px; }
  .card p { font-size: 16px; color: #666; line-height: 1.6; margin-bottom: 30px; flex-grow: 1; }
  
  .btn { display: inline-block; padding: 14px 28px; border-radius: 100px; font-weight: 700; text-align: center; width: 100%; }
  .btn-beleza { background: #b87c7c; color: white; }
  .btn-imob { background: #1a2f4a; color: white; }

  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } .hero h1 { font-size: 36px; } }
</style>
</head>
<body>

<div class="hero">
  <h1>Qual é o seu negócio?</h1>
  <p>Escolha o seu mercado e comece a criar artes que realmente geram clientes.</p>
</div>

  <a href="restaurante.html" class="card rest">
    <div class="icon">🍽️</div>
    <h2>Restaurantes</h2>
    <p>Seu prato merece post que gera pedido. Crie cardápios visuais e promoções para encher o salão e o delivery.</p>
    <span class="btn" style="background: #7a1f2b; color: white;">Ver Planos de Restaurante →</span>
  </a>
</body>
</html>
